# Dashboards, Docker UI, and host metrics. The Deploy workflow starts this when containers is enabled.

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      IMAGES: "1"
      INFO: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      SERVICES: "1"
      TASKS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nginx-network

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    hostname: homarr
    restart: unless-stopped
    environment:
      SECRET_ENCRYPTION_KEY: ${HOMARR_SECRET_ENCRYPTION_KEY}
      TZ: ${TZ}
      DOCKER_HOSTNAMES: socket-proxy
      DOCKER_PORTS: "2375"
    volumes:
      - homarr-data:/appdata
    expose:
      - "7575"
    networks:
      - nginx-network

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    hostname: uptime-kuma
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - uptime-kuma-data:/app/data
    expose:
      - "3001"
    networks:
      - nginx-network

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    hostname: portainer
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    expose:
      - "9000"
    networks:
      - nginx-network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    hostname: redisinsight
    restart: unless-stopped
    volumes:
      - redisinsight-data:/data
    expose:
      - "5540"
    networks:
      - nginx-network
      - data-internal

  keycloak-db-init:
    image: postgres:16
    container_name: keycloak-db-init
    profiles: ["keycloak"]
    restart: "no"
    entrypoint: ["bash", "-ec"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
    command:
      - |
        psql -d postgres -v ON_ERROR_STOP=1 \
          -v kc_user="$$KEYCLOAK_DB_USER" \
          -v kc_pass="$$KEYCLOAK_DB_PASSWORD" \
          -v kc_db="$$KEYCLOAK_DB_NAME" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'kc_user', :'kc_pass')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'kc_user') \gexec
        SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'kc_user', :'kc_pass')
        WHERE EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'kc_user') \gexec
        SELECT format('CREATE DATABASE %I OWNER %I', :'kc_db', :'kc_user')
        WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'kc_db') \gexec
        SQL
    networks:
      - data-internal

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak
    hostname: keycloak
    profiles: ["keycloak"]
    restart: unless-stopped
    command:
      - start
      - --http-enabled=true
      - --proxy-headers=xforwarded
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: https://keycloak.${DOMAIN}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    expose:
      - "8080"
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    networks:
      - nginx-network
      - data-internal

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - metrics

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - metrics

  grafana:
    image: grafana/grafana-oss:11.5.2
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_SERVER_DOMAIN: grafana.${DOMAIN}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    expose:
      - "3000"
    networks:
      - nginx-network
      - metrics
    depends_on:
      - prometheus

volumes:
  homarr-data:
  uptime-kuma-data:
  portainer-data:
  redisinsight-data:
  prometheus-data:
  grafana-data:

networks:
  nginx-network:
    external: true
    name: nginx-network
  data-internal:
    external: true
    name: data-internal
  metrics:
    driver: bridge
