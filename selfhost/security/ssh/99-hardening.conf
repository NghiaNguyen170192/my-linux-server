# Drop-in for /etc/ssh/sshd_config.d/. Apply only after key login works.
# Root SSH stays off. If password login still succeeds, comment out
# PasswordAuthentication in /etc/ssh/sshd_config (a later line overrides this file).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 20
ClientAliveInterval 300
ClientAliveCountMax 2
