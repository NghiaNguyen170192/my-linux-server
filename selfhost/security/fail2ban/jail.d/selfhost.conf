[DEFAULT]
bantime = 1h
findtime = 10m
maxretry = 5
# Add your own public IP so a failed SSH session cannot lock you out:
# ignoreip = 127.0.0.1/8 ::1 203.0.113.10

[sshd]
enabled = true
backend = systemd
port = ssh
maxretry = 4
findtime = 10m
bantime = 1d

[recidive]
enabled = true
logpath = /var/log/fail2ban.log
banaction = %(banaction_allports)s
bantime = 1w
findtime = 1d
maxretry = 5

# HTTP jails stay off until /etc/fail2ban/cloudflare.env exists.
# SSH is banned on the VPS firewall. HTTP is banned at Cloudflare, because
# the TCP connection on the VPS comes from Cloudflare's addresses.
[nginx-limit-req]
enabled = false
port = http,https
filter = nginx-limit-req
logpath = /var/lib/selfhost/nginx/logs/error.log
maxretry = 8
findtime = 2m
bantime = 1h
action = cloudflare

[nginx-probes]
enabled = false
port = http,https
filter = nginx-probes
logpath = /var/lib/selfhost/nginx/logs/access.log
maxretry = 3
findtime = 10m
bantime = 1d
action = cloudflare
