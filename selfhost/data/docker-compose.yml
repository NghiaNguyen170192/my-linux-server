# Airflow, Postgres, Redis, MinIO, pgAdmin.
# Postgres and Redis stay on the private data-internal network.
# Profile "beoni" is the OMS API and dashboard. They use this Postgres, not their own.
# The Deploy workflow starts this when containers is enabled.

x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.0.6}
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES:-false}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__CELERY__BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    AIRFLOW__CELERY__BROKER_CONNECTION_RETRY_ON_STARTUP: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ${ROOT_DATA_PATH}/airflow/logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 10s
    networks:
      - data-internal

  redis:
    image: redis:7.4-alpine
    container_name: redis
    hostname: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - data-internal

  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: https://minio.${DOMAIN}
      MINIO_SERVER_URL: https://s3.${DOMAIN}
    volumes:
      - ${ROOT_DATA_PATH}/minio/data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 15s
    networks:
      - nginx-network
      - data-internal

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: pgadmin
    hostname: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_DISABLE_POSTFIX: "true"
    expose:
      - "80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nginx-network
      - data-internal

  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    hostname: airflow-apiserver
    command: api-server
    environment:
      <<: *airflow-common-env
      AIRFLOW__API__BASE_URL: https://airflow.${DOMAIN}
      FORWARDED_ALLOW_IPS: "*"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - nginx-network
      - data-internal

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - data-internal

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - data-internal

  airflow-worker:
    <<: *airflow-common
    container_name: airflow-worker
    command: celery worker
    healthcheck:
      test:
        - CMD-SHELL
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - data-internal

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - data-internal

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          export AIRFLOW_UID=$$(id -u)
        fi
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        /entrypoint airflow config list >/dev/null
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/logs
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_WWW_USER_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_WWW_USER_PASSWORD}
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    user: "0:0"
    depends_on:
      <<: *airflow-common-depends-on
    networks:
      - data-internal

  airflow-cli:
    <<: *airflow-common
    profiles: ["debug"]
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on
    networks:
      - data-internal

  flower:
    <<: *airflow-common
    container_name: flower
    hostname: flower
    command: celery flower
    profiles: ["flower"]
    expose:
      - "5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - nginx-network
      - data-internal

  # Separate role and database on the shared Postgres. Same idea as keycloak-db-init.
  beoni-db-init:
    image: postgres:16-alpine
    container_name: beoni-db-init
    profiles: ["beoni"]
    restart: "no"
    entrypoint: ["sh", "-ec"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BEONI_POSTGRES_USER: ${BEONI_POSTGRES_USER:-beoni}
      BEONI_POSTGRES_PASSWORD: ${BEONI_POSTGRES_PASSWORD:-}
      BEONI_POSTGRES_DB: ${BEONI_POSTGRES_DB:-beoni_oms}
    command:
      - |
        psql -d postgres -v ON_ERROR_STOP=1 \
          -v app_user="$$BEONI_POSTGRES_USER" \
          -v app_pass="$$BEONI_POSTGRES_PASSWORD" \
          -v app_db="$$BEONI_POSTGRES_DB" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_pass')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user') \gexec
        SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'app_user', :'app_pass')
        WHERE EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user') \gexec
        SELECT format('CREATE DATABASE %I OWNER %I', :'app_db', :'app_user')
        WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'app_db') \gexec
        SQL
    networks:
      - data-internal
    depends_on:
      postgres:
        condition: service_healthy

  beoni-prestart:
    image: ${DOCKERHUB_USERNAME:-unset}/beoni-oms-backend:${BEONI_IMAGE_TAG:-latest}
    container_name: beoni-prestart
    profiles: ["beoni"]
    restart: "no"
    command: bash scripts/prestart.sh
    environment: &beoni-env
      PROJECT_NAME: Beoni OMS
      FRONTEND_HOST: https://beoni.${DOMAIN}
      ENVIRONMENT: production
      BACKEND_CORS_ORIGINS: https://beoni.${DOMAIN}
      SECRET_KEY: ${BEONI_SECRET_KEY:-}
      FIRST_SUPERUSER: ${BEONI_FIRST_SUPERUSER:-}
      FIRST_SUPERUSER_PASSWORD: ${BEONI_FIRST_SUPERUSER_PASSWORD:-}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${BEONI_POSTGRES_DB:-beoni_oms}
      POSTGRES_USER: ${BEONI_POSTGRES_USER:-beoni}
      POSTGRES_PASSWORD: ${BEONI_POSTGRES_PASSWORD:-}
    networks:
      - data-internal
    depends_on:
      postgres:
        condition: service_healthy
      beoni-db-init:
        condition: service_completed_successfully

  beoni-backend:
    image: ${DOCKERHUB_USERNAME:-unset}/beoni-oms-backend:${BEONI_IMAGE_TAG:-latest}
    container_name: beoni-backend
    hostname: beoni-backend
    profiles: ["beoni"]
    restart: unless-stopped
    environment:
      <<: *beoni-env
    volumes:
      - beoni-media:/app/backend/media
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/utils/health-check/')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - nginx-network
      - data-internal
    depends_on:
      postgres:
        condition: service_healthy
      beoni-db-init:
        condition: service_completed_successfully
      beoni-prestart:
        condition: service_completed_successfully

  beoni-frontend:
    image: ${DOCKERHUB_USERNAME:-unset}/beoni-oms-frontend:${BEONI_IMAGE_TAG:-latest}
    container_name: beoni-frontend
    hostname: beoni-frontend
    profiles: ["beoni"]
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - nginx-network

volumes:
  postgres-db-volume:
  pgadmin-data:
  redis-data:
  beoni-media:

networks:
  nginx-network:
    external: true
    name: nginx-network
  data-internal:
    external: true
    name: data-internal
