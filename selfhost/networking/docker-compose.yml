# Edge proxy and certificate issuance. Start with scripts/deploy.sh (loads ../.env).

services:
  nginx:
    image: nginx:1.28-alpine
    container_name: nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ${ROOT_DATA_PATH}/nginx/logs:/var/log/nginx
    networks:
      - nginx-network

  certbot:
    image: certbot/dns-cloudflare:v2.11.0
    profiles: ["certs"]
    volumes:
      - ./certbot/cloudflare.ini:/secrets/cloudflare.ini:ro
      - ./certbot/conf:/etc/letsencrypt
    command:
      - certonly
      - --dns-cloudflare
      - --dns-cloudflare-credentials
      - /secrets/cloudflare.ini
      - --dns-cloudflare-propagation-seconds
      - "30"
      - --keep-until-expiring
      - --non-interactive
      - --agree-tos
      - --email
      - ${CERTBOT_EMAIL}
      - -d
      - ${CERTBOT_DOMAIN}
      - -d
      - ${CERTBOT_WILDCARD_DOMAIN}

networks:
  nginx-network:
    external: true
    name: nginx-network
