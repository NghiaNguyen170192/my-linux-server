services:
  nginx:
    image: nginx:alpine
    hostname: nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - './nginx/conf.d:/etc/nginx/conf.d:ro'
      - './certbot/www:/var/www/certbot'
      - '$HOME/selfhost-data/networking/nginx/ssl:/etc/letsencrypt'
      - '$HOME/selfhost-data/networking/nginx/logs:/var/log/nginx'
    networks:
      - nginx-network

  certbot:
    image: certbot/dns-cloudflare
    container_name: certbot
    profiles:
      - certbot
    volumes:
      - './certbot/cloudflare.ini:/secrets/cloudflare.ini:ro'
      - '$HOME/selfhost-data/networking/nginx/ssl:/etc/letsencrypt'
    command: >
      certonly --dns-cloudflare
      --dns-cloudflare-credentials /secrets/cloudflare.ini
      --dns-cloudflare-propagation-seconds 30
      -d ${CERTBOT_DOMAIN} -d ${CERTBOT_WILDCARD_DOMAIN}
      --non-interactive --agree-tos
      --email ${CERTBOT_EMAIL}
    networks:
      - nginx-network

  # Keep Pi-hole optional; it uses port 53 and should not run with another DNS blocker.
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    profiles:
      - pihole
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "82:80/tcp"
    environment:
      - TZ=${TZ}
      - FTLCONF_webserver_api_password=${PIHOLE_PWD}
    volumes:
      - '$HOME/selfhost-data/networking/pihole/etc-pihole:/etc/pihole'
      - '$HOME/selfhost-data/networking/pihole/etc-dnsmasq.d:/etc/dnsmasq.d'
    restart: unless-stopped
    networks:
      - nginx-network

  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: fail2ban
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - '$HOME/selfhost-data/networking/fail2ban/data:/data'
      - '/var/log/auth.log:/var/log/auth.log:ro'
      - '$HOME/selfhost-data/networking/nginx/logs:/var/log/nginx:ro'
      - './fail2ban/jail.d:/data/jail.d:ro'
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - F2B_LOG_TARGET=STDOUT
      - F2B_LOG_LEVEL=INFO
      - F2B_DB_PURGE_AGE=1d

networks:
  nginx-network:
    external: true
