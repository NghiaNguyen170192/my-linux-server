resolver 127.0.0.11 valid=10s;

upstream bitcoin_backend {
    server bitcoinpredictor:5000;   # must match the alias you set
}

# Bitcoin Predictor App

server {
    listen 443 ssl;
    server_name bitcoinpredictor.nqtn.dev;

    ssl_certificate /etc/letsencrypt/live/nqtn.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nqtn.dev/privkey.pem;

    location / {
        proxy_pass http://bitcoin_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # optional timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name airflow.nqtn.dev minio.nqtn.dev pgadmin.nqtn.dev bitcoinpredictor.nqtn.dev keycloak.nqtn.dev redisinsight.nqtn.dev portainer.nqtn.dev homarr.nqtn.dev blog.nqtn.dev komga.nqtn.dev grafana.nqtn.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
