server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name adguard.nqtn.dev;

    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/errors.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    limit_req zone=general burst=20 nodelay;

    # After the first-run wizard, AdGuard serves the UI on port 80.
    # Until a config exists it listens on 3000; see the README.
    location / {
        include /etc/nginx/snippets/proxy.conf;
        set $upstream adguardhome:80;
        proxy_pass http://$upstream;
    }
}
