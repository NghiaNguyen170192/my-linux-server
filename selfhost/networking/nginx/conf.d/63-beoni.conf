server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name beoni.YOUR_DOMAIN;

    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/errors.conf;
    client_max_body_size 50m;
    limit_req zone=general burst=40 nodelay;

    location / {
        include /etc/nginx/snippets/proxy.conf;
        set $upstream beoni-frontend:80;
        proxy_pass http://$upstream;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.beoni.YOUR_DOMAIN;

    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/errors.conf;
    client_max_body_size 50m;
    limit_req zone=general burst=40 nodelay;

    location / {
        include /etc/nginx/snippets/proxy.conf;
        set $upstream beoni-backend:8000;
        proxy_pass http://$upstream;
    }
}
